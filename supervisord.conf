[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/var/lib/postgresql/17/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.err.log

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --port 6379 --save 900 1 --save 300 10 --save 60 10000
user=redis
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address ":9001"
user=minio-user
environment=MINIO_ROOT_USER=chambeapp,MINIO_ROOT_PASSWORD=chambeapp_dev
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/minio.log
stderr_logfile=/var/log/supervisor/minio.err.log

[program:minio-setup]
command=/bin/bash -c "sleep 15 && for i in {1..30}; do /usr/local/bin/mc alias set local http://localhost:9000 chambeapp chambeapp_dev && break || sleep 2; done && /usr/local/bin/mc mb --ignore-existing local/chambeapp-portfolio && /usr/local/bin/mc mb --ignore-existing local/chambeapp-avatars && /usr/local/bin/mc anonymous set public local/chambeapp-avatars"
user=minio-user
autostart=true
autorestart=false
startsecs=20
stdout_logfile=/var/log/supervisor/minio-setup.log
stderr_logfile=/var/log/supervisor/minio-setup.err.log

[program:flask-migrate]
command=/bin/bash -c "sleep 20 && cd /app && flask db stamp head"
user=appuser
environment=DATABASE_URL="postgresql://chambeapp:chambeapp_dev@localhost:5432/chambeapp",REDIS_URL="redis://localhost:6379/0",FLASK_ENV="production",JWT_SECRET_KEY="chambeapp_jwt_secret",SECRET_KEY="chambeapp_secret",S3_ENDPOINT="http://localhost:9000",S3_ACCESS_KEY="chambeapp",S3_SECRET_KEY="chambeapp_dev",S3_BUCKET="chambeapp-portfolio",S3_PUBLIC_BUCKET="chambeapp-avatars",S3_PUBLIC_ENDPOINT="http://localhost:9000"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/flask-migrate.log
stderr_logfile=/var/log/supervisor/flask-migrate.err.log

[program:seed]
command=/bin/bash -c "sleep 35 && cd /app && python seed.py"
user=appuser
environment=DATABASE_URL="postgresql://chambeapp:chambeapp_dev@localhost:5432/chambeapp",REDIS_URL="redis://localhost:6379/0",FLASK_ENV="production",JWT_SECRET_KEY="chambeapp_jwt_secret",SECRET_KEY="chambeapp_secret",S3_ENDPOINT="http://localhost:9000",S3_ACCESS_KEY="chambeapp",S3_SECRET_KEY="chambeapp_dev",S3_BUCKET="chambeapp-portfolio",S3_PUBLIC_BUCKET="chambeapp-avatars",S3_PUBLIC_ENDPOINT="http://localhost:9000"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/seed.log
stderr_logfile=/var/log/supervisor/seed.err.log

[program:backend]
command=gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 wsgi:app
user=appuser
environment=DATABASE_URL="postgresql://chambeapp:chambeapp_dev@localhost:5432/chambeapp",REDIS_URL="redis://localhost:6379/0",FLASK_ENV="production",JWT_SECRET_KEY="chambeapp_jwt_secret",SECRET_KEY="chambeapp_secret",S3_ENDPOINT="http://localhost:9000",S3_ACCESS_KEY="chambeapp",S3_SECRET_KEY="chambeapp_dev",S3_BUCKET="chambeapp-portfolio",S3_PUBLIC_BUCKET="chambeapp-avatars",S3_PUBLIC_ENDPOINT="http://localhost:9000",ONURIX_CLIENT="",ONURIX_KEY="",ONURIX_APP_NAME="ChambeApp",SMS_SEND_DEV="0"
autostart=true
autorestart=true
startsecs=45
startretries=3
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:celery-worker]
command=celery -A app.tasks:celery_app worker --loglevel=info --concurrency=2
user=appuser
environment=DATABASE_URL="postgresql://chambeapp:chambeapp_dev@localhost:5432/chambeapp",REDIS_URL="redis://localhost:6379/0",FLASK_ENV="production",JWT_SECRET_KEY="chambeapp_jwt_secret",SECRET_KEY="chambeapp_secret",S3_ENDPOINT="http://localhost:9000",S3_ACCESS_KEY="chambeapp",S3_SECRET_KEY="chambeapp_dev",S3_BUCKET="chambeapp-portfolio"
autostart=true
autorestart=true
startsecs=50
startretries=3
stdout_logfile=/var/log/supervisor/celery-worker.log
stderr_logfile=/var/log/supervisor/celery-worker.err.log

[program:celery-beat]
command=celery -A app.tasks:celery_app beat --loglevel=info
user=appuser
environment=DATABASE_URL="postgresql://chambeapp:chambeapp_dev@localhost:5432/chambeapp",REDIS_URL="redis://localhost:6379/0",FLASK_ENV="production",JWT_SECRET_KEY="chambeapp_jwt_secret",SECRET_KEY="chambeapp_secret",S3_ENDPOINT="http://localhost:9000",S3_ACCESS_KEY="chambeapp",S3_SECRET_KEY="chambeapp_dev",S3_BUCKET="chambeapp-portfolio"
autostart=true
autorestart=true
startsecs=50
startretries=3
stdout_logfile=/var/log/supervisor/celery-beat.log
stderr_logfile=/var/log/supervisor/celery-beat.err.log